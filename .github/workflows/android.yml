name: Build Master

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build with Gradle
      env:
        OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      run: |
        echo "OWM_API_KEY=$OWM_API_KEY" >> local.properties
        ./gradlew build
