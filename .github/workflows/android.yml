name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write local.properties
      env:
        OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "OWM_API_KEY=$OWM_API_KEY" >> local.properties
        if [ -n "$KEYSTORE_PASSWORD" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/catsanddogs-release.jks
          echo "KEYSTORE_PATH=${{ github.workspace }}/catsanddogs-release.jks" >> local.properties
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
          echo "KEY_ALIAS=$KEY_ALIAS" >> local.properties
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
        fi

    - name: Build with Gradle
      run: ./gradlew lint test build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk

  # Compose UI tests (androidTest) need a real device, so unlike the JVM unit
  # tests in the build job they run inside an emulator booted on the runner
  # itself. Kept as a separate job so a slow/flaky emulator boot never blocks
  # the fast lint+unit-test feedback loop above; both jobs report their own
  # status on the PR independently.
  instrumented-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Only OWM_API_KEY is needed here: androidTest builds use debug signing, so
    # the keystore secrets the build job restores are not required.
    - name: Write local.properties
      env:
        OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      run: echo "OWM_API_KEY=$OWM_API_KEY" >> local.properties

    # Standard fix for GitHub-hosted Linux runners: /dev/kvm exists but isn't
    # group-accessible by default, which the emulator needs for hardware
    # acceleration (without it, boot takes several minutes instead of ~30s).
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # google_apis (not the plain "default" target) so Play Services is present:
    # the app initializes Firebase on launch regardless of which screen a test
    # exercises. Pinned to a stable API level rather than the newest one, since
    # a preview-level system image can trip an unrelated Espresso/InputManager
    # incompatibility. There are no product flavors, so a single
    # connectedDebugAndroidTest runs the whole suite once.
    - name: Run Compose UI tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        script: ./gradlew :app:connectedDebugAndroidTest

    - name: Upload instrumented test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-reports
        path: '**/build/reports/androidTests/'
